# Harness pipeline "ai-app" — stored in Git (Harness Git Experience).
# Harness reads this file from GitHub on every run: edit it here and push,
# never paste it into the UI.
#
# Build -> Kosli trail + artifact/PR/decision attestations -> Test (smoke + JUnit
# attestation) -> Deploy to namespace ai-app (Kosli environment ai-app-prod).
#
# ONE-TIME: set pipeline variable githubRepoId to the GitHub repo's numeric id
#   (gh api repos/SoniaBoussabeh/ai-app --jq .id). Harness is not a CI Kosli
#   auto-detects, so repo metadata is passed explicitly.
pipeline:
  projectIdentifier: foodtrucksre
  orgIdentifier: default
  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: false
          execution:
            steps:
              - step:
                  type: Run
                  name: Echo Welcome Message
                  identifier: Echo_Welcome_Message
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    command: echo "Welcome to Harness CI"

              - step:
                  type: GitClone
                  name: GitClone_1
                  identifier: GitClone_1
                  spec:
                    connectorRef: account.githubsonia
                    repoName: ai-app
                    cloneDirectory: /harness/test
                    build:
                      type: branch
                      spec:
                        branch: <+pipeline.variables.gitBranch>

              # <-- KOSLI: install the CLI into the shared /harness volume and
              # capture the commit SHA. Needed because cloneCodebase is false, so
              # <+codebase.commitSha> is not available in this pipeline.
              - step:
                  type: Run
                  name: Kosli Setup
                  identifier: Kosli_Setup
                  spec:
                    connectorRef: account.dockerio
                    image: alpine/git:latest
                    shell: Sh
                    command: |-
                      set -eu
                      KOSLI_VERSION=2.36.1
                      apk add --no-cache curl >/dev/null
                      mkdir -p /harness/bin
                      tmp=$(mktemp -d)
                      curl -fsSL "https://github.com/kosli-dev/cli/releases/download/v${KOSLI_VERSION}/kosli_${KOSLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$tmp"
                      mv "$tmp/kosli" /harness/bin/kosli
                      chmod +x /harness/bin/kosli
                      # fails loudly here rather than mysteriously three steps later
                      /harness/bin/kosli version
                      export COMMIT_SHA=$(git -C /harness/test rev-parse HEAD)
                      echo "commit sha: $COMMIT_SHA"
                    outputVariables:
                      - name: COMMIT_SHA

              - step:
                  type: Run
                  name: Read Version
                  identifier: Read_Version
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    command: |-
                      export APP_VERSION=$(tr -d ' \t\r\n' < /harness/test/VERSION)
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      # Release builds (main) are tagged VERSION; PR builds VERSION-<sha7>,
                      # so a feature branch can never overwrite a released tag.
                      if [ "<+pipeline.variables.isRelease>" = "true" ]; then
                        export IMAGE_TAG="$APP_VERSION"
                      else
                        export IMAGE_TAG="$APP_VERSION-$(echo "$SHA" | cut -c1-7)"
                      fi
                      echo "App version: $APP_VERSION  image tag: $IMAGE_TAG"
                    outputVariables:
                      - name: APP_VERSION
                      - name: IMAGE_TAG

              # PR builds only: every PR must raise VERSION above main's, otherwise
              # the release would reuse an existing image tag. Fails the PR check, so
              # with branch protection the PR cannot be merged until VERSION is bumped.
              - step:
                  type: Run
                  name: Check Version Bump
                  identifier: Check_Version_Bump
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.isRelease> == "false"
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("account.github_token")>
                    command: |-
                      set -eu
                      apk add --no-cache curl >/dev/null
                      NEW=<+execution.steps.Read_Version.output.outputVariables.APP_VERSION>
                      OLD=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
                        "https://api.github.com/repos/SoniaBoussabeh/ai-app/contents/VERSION?ref=main" | tr -d ' \t\r\n')
                      echo "VERSION on main: $OLD   in this PR: $NEW"
                      # numeric MAJOR.MINOR.PATCH comparison (busybox has no sort -V)
                      HIGHER=$(awk -v a="$OLD" -v b="$NEW" 'BEGIN { split(a, x, "."); split(b, y, ".");
                        for (i = 1; i <= 3; i++) { if (y[i] + 0 > x[i] + 0) { print "yes"; exit }
                                                   if (y[i] + 0 < x[i] + 0) { print "no"; exit } }
                        print "no" }')
                      if [ "$HIGHER" != "yes" ]; then
                        echo "ERROR: bump VERSION above $OLD in this PR (e.g. patch: increase the last number)."
                        exit 1
                      fi

              # <-- KOSLI: create/update the flow from the versioned template, then
              # open a trail for this commit. `create flow` is idempotent, so the
              # template in git stays the single source of truth.
              - step:
                  type: Run
                  name: Kosli Begin Trail
                  identifier: Kosli_Begin_Trail
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      /harness/bin/kosli create flow ai-app \
                        --description "ai-app delivery process" \
                        --template-file /harness/test/kosli/flow-template.yml
                      /harness/bin/kosli begin trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/ai-app" \
                        --repo-url "https://github.com/SoniaBoussabeh/ai-app" \
                        --repo-id "<+pipeline.variables.githubRepoId>" \
                        --description "ai-app build <+pipeline.sequenceId>"

              # Static check of the pages (htmlhint default rules), as JUnit.
              - step:
                  type: Run
                  name: HTML Lint
                  identifier: HTML_Lint
                  spec:
                    connectorRef: account.dockerio
                    image: node:20-alpine
                    shell: Sh
                    command: |-
                      set -u
                      mkdir -p /harness/lint-results
                      cd /harness/test
                      npx --yes htmlhint@1.1.4 "app/**/*.html" --format junit > /harness/lint-results/html.xml
                      RC=$?
                      cat /harness/lint-results/html.xml
                      exit $RC
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - /harness/lint-results/*.xml

              # `stageStatus: All`: a failed lint is evidence too and must reach Kosli.
              - step:
                  type: Run
                  name: Kosli Attest HTML Lint
                  identifier: Kosli_Attest_HTML_Lint
                  when:
                    stageStatus: All
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      /harness/bin/kosli attest junit \
                        --name html-lint \
                        --results-dir /harness/lint-results \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/ai-app" \
                        --repo-url "https://github.com/SoniaBoussabeh/ai-app" \
                        --repo-id "<+pipeline.variables.githubRepoId>" \
                        --origin-url "<+pipeline.executionUrl>"

              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: account.dockerio
                    repo: soniabou/ai-app
                    tags:
                      - <+execution.steps.Read_Version.output.outputVariables.IMAGE_TAG>
                    buildArgs:
                      APP_VERSION: <+execution.steps.Read_Version.output.outputVariables.APP_VERSION>
                    context: /harness/test
                    dockerfile: /harness/test/Dockerfile

              # <-- KOSLI: must run AFTER the push. --artifact-type oci resolves the
              # real sha256 digest from Docker Hub; that digest is the only thing the
              # cluster reporter can see, so it is the join key.
              - step:
                  type: Run
                  name: Kosli Attest Artifact
                  identifier: Kosli_Attest_Artifact
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      VER=<+execution.steps.Read_Version.output.outputVariables.IMAGE_TAG>
                      /harness/bin/kosli attest artifact "docker.io/soniabou/ai-app:${VER}" \
                        --artifact-type oci \
                        --name ai-app \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --commit-url "https://github.com/SoniaBoussabeh/ai-app/commit/${SHA}" \
                        --build-url "<+pipeline.executionUrl>" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/ai-app" \
                        --repo-url "https://github.com/SoniaBoussabeh/ai-app" \
                        --repo-id "<+pipeline.variables.githubRepoId>"

              # <-- KOSLI: scans the pushed image (Trivy) and records its SBOM (Syft).
              # REPORT-ONLY: HIGH/CRITICAL findings make the `vulnerability-scan`
              # attestation non-compliant but do not stop the build, so Kosli policy
              # (not the pipeline) decides. Set SCAN_GATE=true to also fail the build.
              - step:
                  type: Run
                  name: Kosli Attest Vulnerability Scan and SBOM
                  identifier: Kosli_Attest_Scan_SBOM
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                      SCAN_GATE: "false"
                    command: |-
                      set -eu
                      TRIVY_VERSION=0.56.2
                      SYFT_VERSION=1.14.0
                      apk add --no-cache curl jq >/dev/null
                      curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy
                      curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin syft
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      IMAGE="docker.io/soniabou/ai-app:<+execution.steps.Read_Version.output.outputVariables.IMAGE_TAG>"
                      REPO="--repo-root /harness/test --repo-provider github --repository SoniaBoussabeh/ai-app --repo-url https://github.com/SoniaBoussabeh/ai-app --repo-id <+pipeline.variables.githubRepoId>"

                      trivy image --quiet --severity HIGH,CRITICAL --format json -o /harness/trivy.json "$IMAGE"
                      HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' /harness/trivy.json)
                      CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' /harness/trivy.json)
                      if [ "$((HIGH + CRIT))" -eq 0 ]; then COMPLIANT=true; else COMPLIANT=false; fi
                      echo "Trivy: $CRIT CRITICAL, $HIGH HIGH -> compliant=$COMPLIANT"
                      printf '{"scanner":"trivy %s","critical":%s,"high":%s}\n' "$TRIVY_VERSION" "$CRIT" "$HIGH" > /harness/trivy-summary.json
                      /harness/bin/kosli attest generic \
                        --name vulnerability-scan \
                        --compliant="$COMPLIANT" \
                        --description "Trivy: $CRIT CRITICAL, $HIGH HIGH in $IMAGE" \
                        --attachments /harness/trivy.json \
                        --user-data /harness/trivy-summary.json \
                        --trail "$SHA" --commit "$SHA" $REPO \
                        --origin-url "<+pipeline.executionUrl>"

                      syft "$IMAGE" -q -o cyclonedx-json=/harness/sbom.cdx.json
                      echo "SBOM: $(jq '.components | length' /harness/sbom.cdx.json) components"
                      /harness/bin/kosli attest generic \
                        --name sbom \
                        --compliant=true \
                        --description "CycloneDX SBOM of $IMAGE (syft $SYFT_VERSION)" \
                        --attachments /harness/sbom.cdx.json \
                        --trail "$SHA" --commit "$SHA" $REPO \
                        --origin-url "<+pipeline.executionUrl>"

                      if [ "$SCAN_GATE" = "true" ] && [ "$COMPLIANT" = "false" ]; then
                        echo "SCAN_GATE: failing the build on HIGH/CRITICAL findings"
                        exit 1
                      fi

              # <-- KOSLI: the only step that calls the GitHub API. Satisfies the
              # `pull-request` attestation in flow-template.yml.
              # Swap `attest` for `assert` to FAIL the build when no approved PR exists.
              - step:
                  type: Run
                  name: Kosli Attest Pull Request
                  # Release builds only: on a PR build the review has not happened yet,
                  # so the verdict would always be "not approved".
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.isRelease> == "true"
                  identifier: Kosli_Attest_PullRequest
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                      KOSLI_GITHUB_TOKEN: <+secrets.getValue("account.github_token")>
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      # NOTE: this subcommand takes --origin-url, NOT --build-url.
                      # --repo-root is required so it can read the local clone.
                      /harness/bin/kosli attest pullrequest github \
                        --name pull-request \
                        --github-org SoniaBoussabeh \
                        --repository ai-app \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --origin-url "<+pipeline.executionUrl>"

              # <-- KOSLI: records a DECISION against control RCTL-043-test
              # ("Source code review"). Controls receive decisions; there is no
              # `kosli attest control`, and `attest pullrequest` has no --control
              # flag, so this must be its own step.
              #
              # The verdict is DERIVED, not hardcoded. A control that always reports
              # compliant is a rubber stamp — audit evidence that proves nothing,
              # which is worse than having no control at all.
              #
              # It queries the GitHub API directly rather than using
              # `kosli assert pullrequest github`, which is the obvious choice but
              # the wrong one — verified 2026-08-13. That command asserts only that
              # a pull request EXISTS for the commit; it says nothing about
              # approvals. RCTL-043-test requires review by a SECOND developer, so a
              # self-merged PR must fail, and `assert` would pass it.
              # It also rejects --repo-root (valid on `attest pullrequest`, not on
              # `assert`), exiting non-zero before ever reaching GitHub — which
              # recorded compliant=false on every run regardless of the PR.
              - step:
                  type: Run
                  name: Kosli Attest Decision RCTL-043-test
                  # Release builds only: on a PR build the review has not happened yet,
                  # so the verdict would always be "not approved".
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.isRelease> == "true"
                  identifier: Kosli_Attest_Decision_RCTL043
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                      KOSLI_GITHUB_TOKEN: <+secrets.getValue("account.github_token")>
                    command: |-
                      # `set -u` only, NOT `set -eu`: a non-compliant verdict must
                      # still reach Kosli. `-e` would abort the step first and the
                      # violation would go UNREPORTED rather than red.
                      set -u
                      apk add --no-cache curl jq >/dev/null

                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      API="https://api.github.com/repos/SoniaBoussabeh/ai-app"
                      AUTH="Authorization: Bearer $KOSLI_GITHUB_TOKEN"
                      ACCEPT="Accept: application/vnd.github+json"

                      # Initialise for `set -u`: the no-PR branch leaves these unset.
                      PR=""; AUTHOR=""; APPROVERS=""

                      # If GitHub itself is unreachable or the token is bad, FAIL THE
                      # STEP. A check that could not run must never be recorded as a
                      # governance verdict — that is how "broken token" silently
                      # becomes "developer skipped review" in an audit.
                      PRS=$(curl -sSf -H "$AUTH" -H "$ACCEPT" "$API/commits/$SHA/pulls") || {
                        echo "ERROR: GitHub API call failed. Check KOSLI_GITHUB_TOKEN and its repo scope."
                        exit 1
                      }
                      PR=$(printf '%s' "$PRS" | jq -r '.[0].number // empty')

                      if [ -z "$PR" ]; then
                        COMPLIANT=false
                        REASON="No pull request found for commit $SHA - the change reached main without review."
                      else
                        AUTHOR=$(curl -sSf -H "$AUTH" -H "$ACCEPT" "$API/pulls/$PR" | jq -r '.user.login')
                        REVIEWS=$(curl -sSf -H "$AUTH" -H "$ACCEPT" "$API/pulls/$PR/reviews?per_page=100")
                        # Self-approval does not satisfy "a SECOND developer", so the
                        # PR author is excluded. GitHub blocks self-approval via the
                        # UI, but excluding explicitly keeps the rule self-evident.
                        APPROVERS=$(printf '%s' "$REVIEWS" | jq -r --arg a "$AUTHOR" \
                          '[.[] | select(.state=="APPROVED") | select(.user.login != $a) | .user.login] | unique | join(", ")')
                        if [ -n "$APPROVERS" ]; then
                          COMPLIANT=true
                          REASON="PR #$PR (author: $AUTHOR) approved by: $APPROVERS"
                        else
                          COMPLIANT=false
                          REASON="PR #$PR (author: $AUTHOR) has no APPROVED review from anyone other than the author."
                        fi
                      fi

                      # Written to a file so the verdict's REASON becomes durable
                      # evidence in Kosli, not just a line in a Harness log that
                      # ages out.
                      {
                        echo "Control:   RCTL-043-test - Source code review"
                        echo "Commit:    $SHA"
                        echo "Compliant: $COMPLIANT"
                        echo "Reason:    $REASON"
                      } > /harness/rctl-043-evidence.txt
                      cat /harness/rctl-043-evidence.txt

                      printf '{"control":"RCTL-043-test","pull_request":"%s","author":"%s","approvers":"%s","compliant":%s}\n' \
                        "$PR" "$AUTHOR" "$APPROVERS" "$COMPLIANT" > /harness/rctl-043-userdata.json

                      # NOTE: --compliant is a bool flag, so it MUST use the
                      # `--compliant=$X` form. `--compliant $X` does not parse.
                      # It is also [defaulted] — omit it and Kosli records a
                      # compliant decision by itself. Always pass it explicitly.
                      #
                      # This command has NO --build-url / --commit-url (unlike
                      # `attest artifact`); passing them fails with unknown flag.
                      #
                      # --repo-id/--repo-url/--repository are auto-set only in
                      # GitHub Actions, GitLab, Bitbucket and Azure DevOps. Harness
                      # is not on that list, so set all three explicitly or none of
                      # the repo metadata is recorded.
                      /harness/bin/kosli attest decision \
                        --name source-code-review-decision \
                        --control RCTL-043-test \
                        --compliant="$COMPLIANT" \
                        --description "$REASON" \
                        --attachments /harness/rctl-043-evidence.txt \
                        --user-data /harness/rctl-043-userdata.json \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/ai-app" \
                        --repo-url "https://github.com/SoniaBoussabeh/ai-app" \
                        --repo-id "<+pipeline.variables.githubRepoId>" \
                        --origin-url "<+pipeline.executionUrl>"

              # <-- KOSLI: the change must reference an existing Jira issue in
              # project SCRUM. Kosli reads the key from the branch name on PR builds
              # (SCRUM-12-add-status-page) and from the commit message on main
              # (GitHub's merge/squash message carries the branch name or PR title).
              # Reports only. Add --assert to FAIL the build when no valid issue
              # is referenced.
              - step:
                  type: Run
                  name: Kosli Attest Jira
                  identifier: Kosli_Attest_Jira
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                      JIRA_API_TOKEN: <+secrets.getValue("account.jira_api_token")>
                    command: |-
                      set -eu
                      SHA=<+execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      /harness/bin/kosli attest jira \
                        --name jira-ticket \
                        --jira-base-url "<+pipeline.variables.jiraBaseUrl>" \
                        --jira-username "<+pipeline.variables.jiraUsername>" \
                        --jira-api-token "$JIRA_API_TOKEN" \
                        --jira-project-key SCRUM \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/ai-app" \
                        --repo-url "https://github.com/SoniaBoussabeh/ai-app" \
                        --repo-id "<+pipeline.variables.githubRepoId>" \
                        --origin-url "<+pipeline.executionUrl>"

          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.SRETrainingCluster
              # CHANGED: was `ai-app`, which is the namespace the app runs in and
              # the namespace the Kosli reporter is scoped to. CI pods landing there
              # get reported as unprovenanced artifacts and flip ai-app-prod to
              # NON-COMPLIANT during every build.
              namespace: harness-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux

    # <-- KOSLI: smoke tests in their OWN stage. They cannot live in
    # the Build stage: Harness creates every step container of a Kubernetes CI
    # stage when the stage STARTS, so an image tag taken from a step output
    # (Read_Version) is still `null` at that point -> "soniabou/ai-app:null"
    # ImagePullBackOff. When this stage starts, Build has finished, so the
    # pipeline-scoped expressions below are resolved.
    #
    # /harness is not shared across stages: the clone (for --repo-root) and the
    # Kosli CLI are fetched again here. The commit SHA comes from Build, so the
    # attestation lands on the same trail even if main has moved since.
    - stage:
        name: Test
        identifier: Test
        type: CI
        spec:
          cloneCodebase: false
          execution:
            steps:
              - step:
                  type: GitClone
                  name: GitClone_Test
                  identifier: GitClone_Test
                  spec:
                    connectorRef: account.githubsonia
                    repoName: ai-app
                    cloneDirectory: /harness/test
                    build:
                      type: branch
                      spec:
                        branch: <+pipeline.variables.gitBranch>

              # Runs the image Build pushed. Steps of a Kubernetes CI stage share
              # one pod, so the tests reach it on 127.0.0.1:8080. No `command`, so
              # the image's own entrypoint (nginx) starts. Pull Always because tags
              # are reused (VERSION is edited by hand) - test what was pushed.
              - step:
                  type: Background
                  name: App Under Test
                  identifier: App_Under_Test
                  spec:
                    connectorRef: account.dockerio
                    image: soniabou/ai-app:<+pipeline.stages.Build.spec.execution.steps.Read_Version.output.outputVariables.IMAGE_TAG>
                    imagePullPolicy: Always

              # Smoke tests written as JUnit XML. `reports` makes Harness show them
              # in the Tests tab; the same file is attested to Kosli next.
              # A failure fails this stage, so the Deploy stage never runs.
              - step:
                  type: Run
                  name: Smoke Tests
                  identifier: Smoke_Tests
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    command: |-
                      set -u
                      VER=<+pipeline.stages.Build.spec.execution.steps.Read_Version.output.outputVariables.APP_VERSION>
                      # 127.0.0.1, NOT localhost: on Alpine `localhost` resolves to ::1
                      # first, busybox wget does not fall back to IPv4, and nginx
                      # listens on IPv4 only (`listen 8080;`) -> every test gets "".
                      URL="http://127.0.0.1:8080"
                      OUT=/harness/test-results
                      mkdir -p "$OUT"

                      # nginx needs a moment to start; give up after 60s.
                      i=0
                      until wget -qO /dev/null "$URL/healthz" 2>/dev/null; do
                        i=$((i+1))
                        if [ "$i" -ge 60 ]; then
                          # Diagnose instead of guessing: the pod shares one network
                          # namespace, so this lists what App Under Test listens on.
                          echo "app did not answer on $URL after 60s. Listening ports:"
                          netstat -tln 2>/dev/null || cat /proc/net/tcp
                          wget -S -O- "$URL/healthz" 2>&1 | head -5
                          break
                        fi
                        sleep 1
                      done

                      TESTS=0; FAILS=0; CASES=""
                      # check NAME EXPECTED ACTUAL - messages stay plain text, no XML escaping needed
                      check() {
                        TESTS=$((TESTS+1))
                        if [ "$2" = "$3" ]; then
                          echo "PASS $1"
                          CASES="$CASES<testcase classname=\"smoke\" name=\"$1\"/>"
                        else
                          echo "FAIL $1: expected $2, got $3"
                          FAILS=$((FAILS+1))
                          CASES="$CASES<testcase classname=\"smoke\" name=\"$1\"><failure message=\"expected $2, got $3\"/></testcase>"
                        fi
                      }

                      check healthz_returns_ok "ok" "$(wget -qO- "$URL/healthz" 2>/dev/null | tr -d '\r\n')"
                      check version_matches_VERSION_file "$VER" "$(wget -qO- "$URL/version" 2>/dev/null | tr -d '\r\n')"
                      check homepage_is_served "200" "$(wget -qO /dev/null "$URL/" 2>/dev/null && echo 200 || echo error)"

                      printf '<?xml version="1.0" encoding="UTF-8"?>\n<testsuites><testsuite name="ai-app-smoke" tests="%s" failures="%s">%s</testsuite></testsuites>\n' \
                        "$TESTS" "$FAILS" "$CASES" > "$OUT/smoke.xml"
                      cat "$OUT/smoke.xml"

                      [ "$FAILS" -eq 0 ]
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - /harness/test-results/*.xml

              # k6 load test against the same image (tests/load/ai-app.js): 5 users
              # for 20 s; thresholds p95 < 500 ms and < 1% errors decide pass/fail.
              - step:
                  type: Run
                  name: Load Test
                  identifier: Load_Test
                  spec:
                    connectorRef: account.dockerio
                    image: grafana/k6:0.54.0
                    shell: Sh
                    command: |-
                      mkdir -p /harness/load-results
                      k6 run --quiet \
                        -e BASE_URL=http://127.0.0.1:8080 \
                        -e RESULTS_FILE=/harness/load-results/load.xml \
                        /harness/test/tests/load/ai-app.js
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - /harness/load-results/*.xml

              - step:
                  type: Run
                  name: Kosli Attest Load Test
                  identifier: Kosli_Attest_Load_Test
                  when:
                    stageStatus: All
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                    command: |-
                      set -eu
                      KOSLI_VERSION=2.36.1
                      apk add --no-cache curl >/dev/null
                      curl -fsSL "https://github.com/kosli-dev/cli/releases/download/v${KOSLI_VERSION}/kosli_${KOSLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kosli
                      SHA=<+pipeline.stages.Build.spec.execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      kosli attest junit \
                        --name load-test \
                        --results-dir /harness/load-results \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/ai-app" \
                        --repo-url "https://github.com/SoniaBoussabeh/ai-app" \
                        --repo-id "<+pipeline.variables.githubRepoId>" \
                        --origin-url "<+pipeline.executionUrl>"

              # Records the JUnit results on the trail. `stageStatus: All` runs
              # this even when Smoke Tests failed - a failed run is evidence too,
              # and must reach Kosli as non-compliant rather than go unreported.
              # Installs the CLI itself: /harness/bin from Build is not here.
              - step:
                  type: Run
                  name: Kosli Attest JUnit
                  identifier: Kosli_Attest_JUnit
                  when:
                    stageStatus: All
                  spec:
                    connectorRef: account.dockerio
                    image: alpine:latest
                    shell: Sh
                    envVariables:
                      KOSLI_API_TOKEN: <+secrets.getValue("account.kosli_api_token")>
                      KOSLI_ORG: SDL-Sandbox
                      KOSLI_FLOW: ai-app
                    command: |-
                      set -eu
                      KOSLI_VERSION=2.36.1
                      apk add --no-cache curl >/dev/null
                      curl -fsSL "https://github.com/kosli-dev/cli/releases/download/v${KOSLI_VERSION}/kosli_${KOSLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kosli
                      kosli version
                      SHA=<+pipeline.stages.Build.spec.execution.steps.Kosli_Setup.output.outputVariables.COMMIT_SHA>
                      # `--name` must match the smoke-tests entry in flow-template.yml.
                      # Harness is not an auto-detected CI, so repo metadata is explicit.
                      kosli attest junit \
                        --name smoke-tests \
                        --results-dir /harness/test-results \
                        --trail "$SHA" \
                        --commit "$SHA" \
                        --repo-root /harness/test \
                        --repo-provider github \
                        --repository "SoniaBoussabeh/ai-app" \
                        --repo-url "https://github.com/SoniaBoussabeh/ai-app" \
                        --repo-id "<+pipeline.variables.githubRepoId>" \
                        --origin-url "<+pipeline.executionUrl>"
          infrastructure:
            useFromStage: Build

    - stage:
        name: Deploy
        identifier: Deploy
        type: Deployment
        # PR builds stop after Test: only a merged change on main is deployed.
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.isRelease> == "true"
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: aiapp
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      sources:
                        - identifier: dockerimage
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.stages.Build.spec.execution.steps.Read_Version.output.outputVariables.IMAGE_TAG>
          environment:
            environmentRef: prod_Env
            deployToAll: false
            infrastructureDefinitions:
              - identifier: aiappinfra
          execution:
            steps:
              - step:
                  type: Policy
                  name: Pre-Deploy Version Check
                  identifier: PreDeployVersionCheck
                  spec:
                    policySets:
                      - devprod
                    type: Custom
                    policySpec:
                      payload: "{\"version\": \"<+pipeline.stages.Build.spec.execution.steps.Read_Version.output.outputVariables.APP_VERSION>\"}"
                  timeout: 10m
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deployment
                  identifier: RollingDeployment
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rolling Rollback
                  identifier: RollingRollback
                  spec:
                    pruningEnabled: false
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  allowStageExecutions: true
  tags: {}
  variables:
    # Set by the triggers: PR trigger -> <+trigger.sourceBranch> / "false",
    # push-to-main trigger -> main / "true".
    - name: gitBranch
      type: String
      value: <+input>.default(main)
    - name: isRelease
      type: String
      value: <+input>.default(true).allowedValues(true,false)
    - name: githubRepoId
      type: String
      value: "1445561751"
    - name: jiraBaseUrl
      type: String
      value: "https://dhw-app.atlassian.net"
    # Atlassian account that owns secret account.jira_api_token.
    - name: jiraUsername
      type: String
      value: "boussabeh.sonia@gmail.com"
  identifier: aiapp
  name: ai-app
