_schema: https://docs.kosli.com/schemas/policy/v1

# Kosli ENVIRONMENT policy for ai-app (evaluated on every snapshot of ai-app-prod).
#
#   kosli create policy ai-app-policy kosli/policy-ai-app.yaml \
#     --description "ai-app runtime requirements" --type env
#   kosli attach-policy ai-app-policy --environment ai-app-prod

artifacts:
  # PHASE 1: everything running must have been attested by the pipeline.
  provenance:
    required: true

  # PHASE 2: enable once the pull-request / decision / smoke-tests attestations
  # are green on a few builds.
  #
  # trail-compliance:
  #   required: true
